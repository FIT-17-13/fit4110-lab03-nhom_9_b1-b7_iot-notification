name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start Prism mock servers
        run: |
          nohup npx prism mock contracts/iot-ingestion.openapi.yaml -p 4010 > prism-iot.log 2>&1 &
          nohup npx prism mock contracts/notification.openapi.yaml -p 4011 > prism-notify.log 2>&1 &

      - name: Wait for mock servers
        # Đổi sang kiểm tra cổng TCP thay vì gọi /health. 
        # Chỉ cần cổng 4010 và 4011 mở là CI sẽ chạy tiếp ngay lập tức.
        run: npx wait-on tcp:localhost:4010 tcp:localhost:4011 --timeout 30000

      - name: Run Newman for IoT
        run: npx newman run postman/collections/team9_iot_ingestion.postman_collection.json -e postman/environments/team9_mock.postman_environment.json -r cli,htmlextra --reporter-htmlextra-export reports/iot-report.html --suppress-exit-code

      - name: Run Newman for Notification
        run: npx newman run postman/collections/team9_notification.postman_collection.json -e postman/environments/team9_mock.postman_environment.json -r cli,htmlextra --reporter-htmlextra-export reports/notify-report.html --suppress-exit-code

      - name: Show Prism logs on failure
        if: failure()
        run: |
          cat prism-iot.log || true
          cat prism-notify.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/